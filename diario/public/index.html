<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3a2a1a" />
  <title>Meu Diário</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="login-screen" class="screen">
    <form id="login-form" class="login-card">
      <h1>Meu Diário</h1>
      <p class="subtitle">Escreva. O backup acontece sozinho.</p>
      <input type="password" id="password-input" placeholder="Senha" autocomplete="current-password" autofocus />
      <button type="submit">Entrar</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <div id="app-screen" class="screen" hidden>
    <aside id="list-panel" class="panel">
      <header class="list-header">
        <h1>Meu Diário</h1>
        <button id="logout-btn" class="icon-btn" title="Sair">Sair</button>
      </header>
      <button id="today-btn" class="today-btn">✎ Escrever hoje</button>
      <ul id="entries-list" class="entries-list"></ul>
    </aside>

    <main id="editor-panel" class="panel editor-panel">
      <header class="editor-header">
        <button id="back-btn" class="icon-btn back-btn" title="Voltar">←</button>
        <div class="editor-title">
          <h2 id="entry-date-label">Hoje</h2>
          <span id="entry-status" class="status"></span>
        </div>
      </header>
      <textarea id="entry-content" placeholder="O que aconteceu hoje?"></textarea>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
